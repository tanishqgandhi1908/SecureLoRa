; SecureLoRa GATEWAY (the "house" board): LoRa -> Wi-Fi -> server
[env:esp32dev]
platform = espressif32@6.9.0     ; same version as the labs
board = esp32dev
framework = arduino
monitor_speed = 115200
; lets you type commands (like "fake") in the Serial Monitor, same as Lab 3.
; time = timestamp on every line, log2file = also save everything to a .log file in this folder
; (needed for the 72 h reliability report; *.log is git-ignored).
monitor_eol = LF
monitor_filters = send_on_enter, time, log2file
monitor_echo = yes
build_flags =
    -I../shared                  ; pin map, helpers and radio settings shared with the node
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    adafruit/Adafruit INA219@^1.2.3     ; node current measurement
