; SecureLoRa GATEWAY (the "house" board): LoRa -> Wi-Fi -> server
[env:esp32dev]
platform = espressif32@6.9.0     ; same version as the labs
board = esp32dev
framework = arduino
monitor_speed = 115200
; lets you type commands (like "fake") in the Serial Monitor, same as Lab 3
monitor_eol = LF
monitor_filters = send_on_enter
monitor_echo = yes
build_flags =
    -I../shared                  ; pin map, helpers and radio settings shared with the node
lib_deps =
    sandeepmistry/LoRa@^0.8.0
