apiVersion: 1

datasources:
  - name: InfluxDB_SecureLoRa
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: securelora
      defaultBucket: readings
      tlsSkipVerify: true
    secureJsonData:
      token: $INFLUXDB_TOKEN   # from server/.env via docker-compose
    isDefault: true
    editable: true
