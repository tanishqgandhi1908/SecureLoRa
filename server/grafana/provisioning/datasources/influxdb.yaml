apiVersion: 1

datasources:
  - name: InfluxDB_SecureLoRa
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: securelora
      defaultBucket: readings
      tlsSkipVerify: true
    secureJsonData:
      token: securelora_influx_super_secret_token_2026_abcdef
    isDefault: true
    editable: true
