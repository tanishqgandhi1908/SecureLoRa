; SecureLoRa NODE (the "shed" board): BMP280 -> LoRa
[env:esp32dev]
platform = espressif32@6.9.0     ; same version as the labs
board = esp32dev
framework = arduino
monitor_speed = 115200
; type test commands (replay / tamper / forge) in the Serial Monitor
monitor_eol = LF
monitor_filters = send_on_enter, time
monitor_echo = yes
build_flags =
    -I../shared                  ; pin map, helpers and radio settings shared with the gateway
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    adafruit/DHT sensor library@^1.4.6      ; DHT-11 (replaced the failed BMP280 on Nov 20)
    adafruit/Adafruit Unified Sensor@^1.1.14 ; needed by the DHT library
